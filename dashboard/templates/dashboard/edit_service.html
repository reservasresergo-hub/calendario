<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar servicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        h1 { margin-top: 0; }

        .muted { color: #666; }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
        }

        .checkbox-row {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-row input {
            width: auto;
        }

        .checkbox-row label {
            margin: 0;
            font-weight: normal;
        }

        .btn {
            display: inline-block;
            background: black;
            color: white;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 9px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-secondary {
            background: #555;
            margin-left: 8px;
        }

        .error-box {
            background: #fff4f4;
            border: 1px solid #f0caca;
            color: #9b1c1c;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 18px;
        }
    </style>
{% include "dashboard/_theme_vars.html" %}
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Editar servicio</h1>
            <p class="muted">Modifica los datos del servicio de {{ business.name }}.</p>

            {% if error_message %}
                <div class="error-box">
                    {{ error_message }}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <label for="name">Nombre del servicio</label>
                <input type="text" id="name" name="name" value="{{ service.name }}" required>

                <label for="duration">Duración en minutos</label>
                <input type="number" id="duration" name="duration" min="1" value="{{ service.duration_minutes }}" required>

                <label for="price">Precio (€)</label>
                <input type="number" id="price" name="price" step="0.01" min="0" value="{{ service.price }}" required>

                <div class="checkbox-row">
                    <input type="checkbox" id="active" name="active" {% if service.active %}checked{% endif %}>
                    <label for="active">Servicio activo</label>
                </div>

                <button type="submit" class="btn">Guardar cambios</button>
                <a href="/dashboard/services/" class="btn btn-secondary">Volver</a>
            </form>
        </div>
    </div>
</body>
</html>
