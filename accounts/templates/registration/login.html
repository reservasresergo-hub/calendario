<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión | Reservas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 28px;
            color: #6b7280;
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 16px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            margin-top: 26px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {
            background: #000000;
        }

        .register-link {
            margin-top: 18px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .register-link a {
            color: #111827;
            font-weight: 700;
        }

        .errorlist {
            color: #b91c1c;
            font-size: 14px;
            padding-left: 18px;
        }
    </style>
</head>
<body>

<div class="page">
    <div class="card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">
            Accede al panel de tu negocio.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">
                Email
            </label>
            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.password.id_for_label }}">
                Contraseña
            </label>
            {{ form.password }}
            {{ form.password.errors }}

            <button type="submit" class="btn">
                Entrar
            </button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta?
            <a href="{% url 'register_business' %}">Crear cuenta</a>
        </div>
    </div>
</div>

</body>
</html>
